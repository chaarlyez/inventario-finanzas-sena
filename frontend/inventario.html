<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="assets/stokio/favicon.svg" />
  <title>Productos — Stokio</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/tema.js"></script>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#6d28d9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Stokio" />
  <link rel="apple-touch-icon" href="assets/stokio/pwa/apple-touch-icon.png" />
</head>
<body data-page="productos">
  <main class="contenido">
    <div class="encabezado-pagina">
      <div>
        <h1>Productos</h1>
        <p class="subtitulo">Catálogo de productos: precios, stock, ambiente y distribuidor.</p>
      </div>
      <div style="display:flex; gap:0.6rem;">
        <button type="button" class="btn btn-secundario" id="btnRegistrarMovimiento"></button>
        <button type="button" class="btn btn-primario" id="btnNuevoProducto"></button>
      </div>
    </div>

    <p class="mensaje" id="mensajeGlobal"></p>

    <div class="barra-filtros">
      <select id="filtroCategoria">
        <option value="">Todas las categorías</option>
      </select>
      <select id="filtroAmbiente">
        <option value="">Todos los ambientes</option>
      </select>
      <select id="filtroEstado">
        <option value="">Todos los estados</option>
        <option value="en_stock">En stock</option>
        <option value="stock_bajo">Stock bajo</option>
        <option value="sin_stock">Sin stock</option>
      </select>
    </div>

    <div class="tabla-contenedor">
      <div class="tabla-scroll">
        <table>
          <thead>
            <tr>
              <th>Producto</th><th>Categoría</th><th>Ambiente</th><th>Costo</th><th>Precio venta</th><th>Stock</th><th>Estado</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaProductos"><tr class="tabla-vacio-fila"><td colspan="8">Cargando…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/inventario.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
