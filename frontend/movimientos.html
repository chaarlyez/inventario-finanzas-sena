<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movimientos de dinero — Stokio</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="dinero" data-search-placeholder="Buscar por categoría o descripción…">
  <main class="contenido">
    <div class="encabezado-pagina">
      <div>
        <h1>Movimientos de dinero</h1>
        <p class="subtitulo">Ingresos y egresos del negocio.</p>
      </div>
      <button type="button" class="btn btn-primario" id="btnRegistrarDinero"></button>
    </div>

    <p class="mensaje" id="mensajeGlobal"></p>

    <div class="tira-resumen">
      <div class="tarjeta tarjeta-stat">
        <div class="icono-circulo verde"></div>
        <div class="etiqueta">Ingresos totales</div>
        <div class="valor" id="resIngresos">—</div>
      </div>
      <div class="tarjeta tarjeta-stat">
        <div class="icono-circulo rojo"></div>
        <div class="etiqueta">Egresos totales</div>
        <div class="valor" id="resEgresos">—</div>
      </div>
      <div class="tarjeta tarjeta-stat">
        <div class="icono-circulo morado"></div>
        <div class="etiqueta">Balance</div>
        <div class="valor" id="resBalance">—</div>
      </div>
      <div class="tarjeta tarjeta-stat">
        <div class="icono-circulo azul"></div>
        <div class="etiqueta">Valor inventario actual</div>
        <div class="valor" id="resValorInventario">—</div>
      </div>
    </div>

    <div class="tabla-contenedor">
      <div class="tabla-scroll">
        <table>
          <thead>
            <tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Monto</th><th>Producto</th><th>Descripción</th></tr>
          </thead>
          <tbody id="tablaMovimientosDinero"><tr class="tabla-vacio-fila"><td colspan="6">Cargando…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/movimientos.js"></script>
</body>
</html>
