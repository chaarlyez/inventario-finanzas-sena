<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Stokio</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="pagina-login">
  <div class="login-shell">
    <aside class="login-marca">
      <div class="login-marca-logo">
        <span class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="M3 8l9 5 9-5"/><path d="M12 21v-8"/></svg>
        </span>
        <span class="login-marca-texto">STOKIO</span>
      </div>
      <p class="login-marca-slogan">Controla. Organiza. Conoce.</p>
      <p class="login-marca-desc">Tu inventario y tus finanzas, en un solo lugar.</p>
    </aside>

    <main class="login-formulario">
      <div class="login-caja">
        <h1>Bienvenido de nuevo</h1>
        <p class="subtitulo">Ingresa tus datos para acceder a tu inventario.</p>

        <form id="formLogin">
          <label class="campo">Correo
            <input type="email" name="email" placeholder="tucorreo@ejemplo.com" required autofocus />
          </label>
          <label class="campo">Contraseña
            <input type="password" name="password" placeholder="••••••••" required />
          </label>

          <p class="mensaje error" id="mensajeLogin"></p>

          <button type="submit" class="btn btn-primario login-boton">Iniciar sesión</button>
        </form>

        <p class="login-ayuda">¿No tienes acceso? Contacta al administrador.</p>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
